name: Build & Release Client (Windows & Android)

on:
  push:
    tags:
      - 'v*'
    branches:
      - dev

  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0 or v1.0.0-dev.1). Leave empty to auto-generate.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  # ============================================================
  # 1. Prepare Release Metadata & Tag
  # ============================================================
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_info.outputs.tag }}
      version_name: ${{ steps.release_info.outputs.version_name }}
      build_number: ${{ steps.release_info.outputs.build_number }}
      is_prerelease: ${{ steps.release_info.outputs.is_prerelease }}
      release_title: ${{ steps.release_info.outputs.release_title }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine Release Tag & Version
        id: release_info
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $inputTag = '${{ github.event.inputs.tag_name }}'.Trim()
          $runNumber = '${{ github.run_number }}'

          $versionLine = Get-Content frontend/pubspec.yaml |
            Select-String '^version:' |
            Select-Object -First 1

          if (-not $versionLine) {
            throw "Could not find version: in frontend/pubspec.yaml"
          }

          $rawVer = ($versionLine.Line -split ':', 2)[1].Trim()
          $verParts = $rawVer.Split('+')
          $semVer = $verParts[0]

          $semParts = $semVer.Split('.')
          $major = if ($semParts.Length -ge 1) { $semParts[0] } else { "1" }
          $minor = if ($semParts.Length -ge 2) { $semParts[1] } else { "0" }

          $isTagPush = '${{ github.event_name }}' -eq 'push' -and '${{ github.ref }}'.StartsWith('refs/tags/')
          $branch = '${{ github.ref_name }}'
          $isDevBranch = $branch -eq 'dev' -or '${{ github.ref }}' -eq 'refs/heads/dev'

          if ($isTagPush) {
            $refTag = '${{ github.ref_name }}'
            $tag = if ($refTag.StartsWith('v')) { $refTag } else { "v$refTag" }
            $verName = $tag.TrimStart('v')
            $isPrerelease = $tag -match '-(dev|beta|rc|alpha)'
            $releaseTitle = if ($isPrerelease) { "Pre-release $tag" } else { "Release $tag" }
          }
          elseif ($inputTag) {
            $tag = if ($inputTag.StartsWith('v')) { $inputTag } else { "v$inputTag" }
            $verName = $tag.TrimStart('v')
            $isPrerelease = $tag -match '-(dev|beta|rc|alpha)' -or $isDevBranch
            $releaseTitle = if ($isPrerelease) { "Dev Build $tag" } else { "Release $tag" }
          }
          elseif ($isDevBranch) {
            $verName = "$major.$minor.$runNumber-dev"
            $tag = "v$verName"
            $isPrerelease = $true
            $releaseTitle = "Dev Build $tag"
          }
          else {
            $verName = "$major.$minor.$runNumber"
            $tag = "v$verName"
            $isPrerelease = $false
            $releaseTitle = "Release $tag"
          }

          $buildNumber = $runNumber

          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag '$tag'. Expected format like v1.0.0."
          }

          Write-Host "Release tag   : $tag"
          Write-Host "Version name  : $verName"
          Write-Host "Build number  : $buildNumber"
          Write-Host "Is Pre-release: $isPrerelease"
          Write-Host "Release title : $releaseTitle"

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version_name=$verName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "build_number=$buildNumber" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "is_prerelease=$($isPrerelease.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_title=$releaseTitle" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create Git Tag if Needed
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Checking whether tag $env:RELEASE_TAG exists..."
          gh api "repos/${{ github.repository }}/git/ref/tags/$env:RELEASE_TAG" --silent 2>$null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tag $env:RELEASE_TAG already exists."
          }
          else {
            Write-Host "Creating tag $env:RELEASE_TAG..."
            gh api --method POST "repos/${{ github.repository }}/git/refs" `
              -f "ref=refs/tags/$env:RELEASE_TAG" `
              -f "sha=${{ github.sha }}"

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create tag $env:RELEASE_TAG"
            }
            Write-Host "Tag $env:RELEASE_TAG created successfully."
          }

  # ============================================================
  # 2. Parallel Job: Windows Desktop Build
  # ============================================================
  build-windows:
    name: Build Windows Desktop App
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Sync Version into pubspec.yaml
        shell: pwsh
        run: |
          $pubspecPath = "frontend/pubspec.yaml"
          $pubContent = Get-Content $pubspecPath
          $updatedPub = $pubContent -replace '^version:.*', "version: ${{ needs.prepare.outputs.version_name }}+${{ needs.prepare.outputs.build_number }}"
          Set-Content -Path $pubspecPath -Value $updatedPub -Encoding utf8

      - name: Build Windows Desktop App
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw "flutter pub get failed." }

          flutter build windows `
            --release `
            --obfuscate `
            --split-debug-info=build/windows/symbols `
            --build-name="${{ needs.prepare.outputs.version_name }}" `
            --build-number="${{ needs.prepare.outputs.build_number }}"

          if ($LASTEXITCODE -ne 0) { throw "Flutter Windows build failed." }

      - name: Cache Visual C++ Redistributable
        id: cache-vcredist
        uses: actions/cache@v4
        with:
          path: frontend/vc_redist.x64.exe
          key: vc-redist-x64-v1

      - name: Download Visual C++ Redistributable
        if: steps.cache-vcredist.outputs.cache-hit != 'true'
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcRedistUrl = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          $vcRedistFile = "vc_redist.x64.exe"

          Write-Host "Downloading Microsoft Visual C++ Redistributable (x64)..."
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $vcRedistUrl -OutFile $vcRedistFile

          if (-not (Test-Path $vcRedistFile)) {
            throw "Downloaded vc_redist.x64.exe was not found."
          }

      - name: Compile Inno Setup Windows Installer
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force -Path ..\installers | Out-Null

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ needs.prepare.outputs.version_name }}" `
            "/DOutputBaseFilename=TIS_RMS_Client_Setup_${{ needs.prepare.outputs.tag }}" `
            TIS_RMS_Client.iss

          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installers/TIS_RMS_Client_Setup_*.exe
          if-no-files-found: error

  # ============================================================
  # 3. Parallel Job: Android App Build (on Fast Ubuntu Runner)
  # ============================================================
  build-android:
    name: Build Android APKs
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Fix Android Gradle Java Configuration
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gradleProperties = "android/gradle.properties"

          if (Test-Path $gradleProperties) {
            $content = Get-Content $gradleProperties
            $filtered = $content | Where-Object { $_ -notmatch '^\s*org\.gradle\.java\.home\s*=' }
            if ($filtered.Count -ne $content.Count) {
              Set-Content -Path $gradleProperties -Value $filtered -Encoding utf8
            }
          }

      - name: Restore google-services.json from Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        working-directory: frontend/android/app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Content -Path "google-services.json" -Value $env:GOOGLE_SERVICES_JSON -Encoding utf8

      - name: Restore Android Release Keystore from Secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: frontend/android/app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base64 = $env:ANDROID_KEYSTORE_BASE64.Trim()
          $bytes = [Convert]::FromBase64String($base64)
          [IO.File]::WriteAllBytes("$PWD/tis_rms_release.keystore", $bytes)

      - name: Configure Android key.properties
        env:
          KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
        working-directory: frontend/android
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keystoreFile = "app/tis_rms_release.keystore"
          if (Test-Path $keystoreFile) {
            $storePass = if ($env:KEY_STORE_PASSWORD) { $env:KEY_STORE_PASSWORD } else { "android" }
            $keyPass = if ($env:KEY_PASSWORD) { $env:KEY_PASSWORD } else { "android" }
            $alias = if ($env:KEY_ALIAS) { $env:KEY_ALIAS } else { "androiddebugkey" }

            @(
              "storePassword=$storePass",
              "keyPassword=$keyPass",
              "keyAlias=$alias",
              "storeFile=tis_rms_release.keystore"
            ) | Set-Content -Path "key.properties" -Encoding ascii
          }

      - name: Sync Version into pubspec.yaml
        shell: pwsh
        run: |
          $pubspecPath = "frontend/pubspec.yaml"
          $pubContent = Get-Content $pubspecPath
          $updatedPub = $pubContent -replace '^version:.*', "version: ${{ needs.prepare.outputs.version_name }}+${{ needs.prepare.outputs.build_number }}"
          Set-Content -Path $pubspecPath -Value $updatedPub -Encoding utf8

      - name: Build Android APKs
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw "flutter pub get failed." }

          $tag = "${{ needs.prepare.outputs.tag }}"
          $verName = "${{ needs.prepare.outputs.version_name }}"
          $buildNum = "${{ needs.prepare.outputs.build_number }}"
          $isPrerelease = "${{ needs.prepare.outputs.is_prerelease }}" -eq 'true'

          New-Item -ItemType Directory -Force -Path "../installers" | Out-Null

          if ($isPrerelease) {
            Write-Host "Dev build: Building Universal APK only..."
            flutter build apk `
              --release `
              --obfuscate `
              --split-debug-info=build/app/outputs/symbols `
              --build-name="$verName" `
              --build-number="$buildNum"

            if ($LASTEXITCODE -ne 0) { throw "Flutter Android Universal APK build failed." }

            $apkUni = "build/app/outputs/flutter-apk/app-release.apk"
            if (-not (Test-Path $apkUni)) { throw "Missing $apkUni" }
            Copy-Item $apkUni "../installers/TIS_RMS_Universal_$tag.apk" -Force
            Copy-Item $apkUni "../installers/TIS_RMS_Universal.apk" -Force
          }
          else {
            Write-Host "Production build: Building Split-per-ABI APKs (32-bit & 64-bit)..."
            flutter build apk `
              --release `
              --split-per-abi `
              --obfuscate `
              --split-debug-info=build/app/outputs/symbols `
              --build-name="$verName" `
              --build-number="$buildNum"

            if ($LASTEXITCODE -ne 0) { throw "Flutter Android split-per-abi build failed." }

            $apk32 = "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"
            $apk64 = "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
            Copy-Item $apk32 "../installers/TIS_RMS_32bit_$tag.apk" -Force
            Copy-Item $apk64 "../installers/TIS_RMS_64_$tag.apk" -Force
            Copy-Item $apk32 "../installers/TIS_RMS_32bit.apk" -Force
            Copy-Item $apk64 "../installers/TIS_RMS_64.apk" -Force

            Write-Host "Production build: Building Universal APK..."
            flutter build apk `
              --release `
              --obfuscate `
              --split-debug-info=build/app/outputs/symbols `
              --build-name="$verName" `
              --build-number="$buildNum"

            if ($LASTEXITCODE -ne 0) { throw "Flutter Android universal APK build failed." }

            $apkUni = "build/app/outputs/flutter-apk/app-release.apk"
            Copy-Item $apkUni "../installers/TIS_RMS_Universal_$tag.apk" -Force
            Copy-Item $apkUni "../installers/TIS_RMS_Universal.apk" -Force
          }

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: installers/TIS_RMS_*.apk
          if-no-files-found: error

  # ============================================================
  # 4. Publish GitHub Release
  # ============================================================
  publish-release:
    name: Publish Release & Upload Artifacts
    needs: [prepare, build-windows, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (Full History for Changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installers

      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: installers

      - name: Verify Downloaded Artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Path installers -Recurse | Select-Object Name, Length

      - name: Generate Release Changelog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = "${{ needs.prepare.outputs.tag }}"
          $prevTag = git tag --merged HEAD --list "v*" --sort=-v:refname 2>$null |
            Where-Object { $_ -and $_ -ne $tag } |
            Select-Object -First 1

          $range = if ($prevTag) { "$prevTag..HEAD" } else { "HEAD" }
          Write-Host "Generating changelog for range: $range"

          $rawCommits = @(git log $range --no-merges --pretty=format:"%h%x09%s")

          $features = [System.Collections.Generic.List[string]]::new()
          $fixes = [System.Collections.Generic.List[string]]::new()
          $improvements = [System.Collections.Generic.List[string]]::new()
          $others = [System.Collections.Generic.List[string]]::new()

          foreach ($line in $rawCommits) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $parts = $line -split "`t", 2
            if ($parts.Count -lt 2) { continue }
            $hash = $parts[0]
            $subject = $parts[1]
            $entry = "- $subject ($hash)"

            if ($subject -match '^feat(\(.+?\))?!?:') {
              $features.Add($entry)
            } elseif ($subject -match '^fix(\(.+?\))?!?:') {
              $fixes.Add($entry)
            } elseif ($subject -match '^(perf|refactor|style)(\(.+?\))?!?:') {
              $improvements.Add($entry)
            } else {
              $others.Add($entry)
            }
          }

          $sb = [System.Text.StringBuilder]::new()
          [void]$sb.AppendLine("## What's Changed")
          [void]$sb.AppendLine()

          if ($features.Count -gt 0) {
            [void]$sb.AppendLine("### Features")
            foreach ($item in $features) { [void]$sb.AppendLine($item) }
            [void]$sb.AppendLine()
          }
          if ($fixes.Count -gt 0) {
            [void]$sb.AppendLine("### Bug Fixes")
            foreach ($item in $fixes) { [void]$sb.AppendLine($item) }
            [void]$sb.AppendLine()
          }
          if ($improvements.Count -gt 0) {
            [void]$sb.AppendLine("### Improvements & Refactors")
            foreach ($item in $improvements) { [void]$sb.AppendLine($item) }
            [void]$sb.AppendLine()
          }
          if ($others.Count -gt 0) {
            [void]$sb.AppendLine("### Other Changes")
            foreach ($item in $others) { [void]$sb.AppendLine($item) }
            [void]$sb.AppendLine()
          }

          if ($rawCommits.Count -eq 0) {
            [void]$sb.AppendLine("- Maintenance release.")
            [void]$sb.AppendLine()
          }

          $changelogPath = "release_changelog.md"
          [System.IO.File]::WriteAllText($changelogPath, $sb.ToString(), [System.Text.UTF8Encoding]::new($false))
          Write-Host (Get-Content $changelogPath -Raw)

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.release_title }}
          body_path: release_changelog.md
          files: |
            installers/TIS_RMS_Client_Setup_*.exe
            installers/TIS_RMS_*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.is_prerelease != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
