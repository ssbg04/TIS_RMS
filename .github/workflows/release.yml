name: Build & Release Client (Windows & Android)

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag like v1.0.0
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to use version from pubspec.yaml, e.g. v1.0.0)'
        required: false
        default: ''

jobs:
  build-and-release:
    name: Build Windows & Android Artifacts
    runs-on: windows-latest
    permissions:
      contents: write # Grants permission to create GitHub Release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Restore google-services.json from Secret
        if: env.GOOGLE_SERVICES_JSON != ''
        working-directory: frontend/android/app
        run: |
          Set-Content -Path "google-services.json" -Value $env:GOOGLE_SERVICES_JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build Windows Desktop App
        working-directory: frontend
        run: |
          flutter pub get
          flutter build windows --release --obfuscate --split-debug-info=build/windows/symbols

      - name: Compile Inno Setup Windows Installer
        working-directory: frontend
        run: |
          New-Item -ItemType Directory -Force -Path ..\installers
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" TIS_RMS_Client.iss

      - name: Build Android Universal APK
        working-directory: frontend
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols
          Copy-Item build\app\outputs\flutter-apk\app-release.apk ..\installers\TIS_RMS_Android_Universal.apk -Force

      - name: Determine Release Tag
        id: release_info
        shell: pwsh
        run: |
          $inputTag = "${{ github.event.inputs.tag_name }}"
          if ($inputTag) {
            $tag = $inputTag
          } elseif ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $tag = "${{ github.ref_name }}"
          } else {
            $rawVer = (Get-Content frontend/pubspec.yaml | Select-String '^version:').Line.Split(':')[1].Split('+')[0].Trim()
            $tag = "v$rawVer"
          }
          Write-Host "Releasing tag: $tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Release ${{ steps.release_info.outputs.tag }}
          files: |
            installers/TIS_RMS_Client_Setup.exe
            installers/TIS_RMS_Android_Universal.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
